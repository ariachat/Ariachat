<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6d3df5" />
  <title>آریاچت | چت‌روم فارسی موبایل</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --primary:#6d3df5;
      --primary-2:#8f63ff;
      --bg:#f5f3fb;
      --card:#fff;
      --text:#20202a;
      --muted:#858391;
      --line:#ece9f5;
      --mine:#6d3df5;
      --other:#fff;
      --shadow:0 12px 35px rgba(42,26,88,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input{font:inherit}
    button{border:0;cursor:pointer}
    body.dark{
      --bg:#111116;--card:#19191f;--text:#f3f1f8;--muted:#aaa7b3;--line:#2b2932;
      --other:#202027;--shadow:0 12px 35px rgba(0,0,0,.28)
    }
    .app{width:100%;max-width:760px;height:100dvh;margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
    .topbar{
      color:#fff;padding:14px 16px 12px;background:linear-gradient(135deg,var(--primary),var(--primary-2));
      box-shadow:0 5px 22px rgba(78,38,180,.20);z-index:5
    }
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px}
    .brand h1{font-size:19px;margin:0}
    .brand small{display:block;font-size:11px;opacity:.82;margin-top:2px}
    .icon-btn{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.14);color:#fff;font-size:20px}
    .onlinebar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}
    .online-dot{width:8px;height:8px;background:#43e48a;border-radius:50%;box-shadow:0 0 0 3px rgba(67,228,138,.16)}
    .roombar{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .room-title{font-weight:700;font-size:14px}
    .room-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .status-pill{font-size:11px;color:var(--primary);background:rgba(109,61,245,.09);padding:7px 10px;border-radius:999px}
    .messages{flex:1;overflow:auto;padding:14px 12px 18px;scroll-behavior:smooth}
    .welcome{text-align:center;color:var(--muted);font-size:12px;padding:10px 8px 16px}
    .date-sep{text-align:center;margin:7px 0 14px;color:var(--muted);font-size:10px}
    .date-sep span{background:var(--card);padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
    .msg-row{display:flex;gap:8px;margin:9px 0;align-items:flex-end}
    .msg-row.mine{justify-content:flex-start}
    .msg-row.other{justify-content:flex-end}
    .avatar{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,#ddd5ff,#a88aff);display:grid;place-items:center;color:#4c2db1;font-weight:700;font-size:12px;flex:0 0 32px}
    .bubble-wrap{max-width:78%}
    .sender{font-size:10px;color:var(--muted);margin:0 6px 4px}
    .bubble{padding:9px 11px;border-radius:15px 15px 5px 15px;background:var(--other);box-shadow:0 3px 12px rgba(0,0,0,.04);border:1px solid var(--line);line-height:1.65;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
    .mine .bubble{background:var(--mine);color:#fff;border:0;border-radius:15px 15px 15px 5px}
    .meta{font-size:9px;color:var(--muted);margin:4px 6px 0}
    .mine .meta{text-align:left}
    .composer{background:var(--card);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));position:relative}
    .typing{height:0;overflow:hidden;color:var(--muted);font-size:10px;padding-right:6px;transition:.2s}
    .typing.show{height:20px}
    .inputrow{display:flex;align-items:flex-end;gap:7px}
    .inputbox{flex:1;display:flex;align-items:flex-end;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:17px;padding:7px 9px}
    #messageInput{width:100%;border:0;outline:0;background:transparent;color:var(--text);resize:none;max-height:110px;min-height:24px;line-height:1.6}
    .emoji-btn{background:transparent;color:var(--muted);font-size:20px;padding:2px}
    .send-btn{width:43px;height:43px;border-radius:14px;background:var(--primary);color:#fff;font-size:18px;box-shadow:0 7px 18px rgba(109,61,245,.24)}
    .send-btn:disabled{opacity:.45;box-shadow:none}
    .emoji-panel{display:none;position:absolute;bottom:68px;right:10px;left:10px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:10px;grid-template-columns:repeat(8,1fr);gap:5px;z-index:4}
    .emoji-panel.open{display:grid}
    .emoji-panel button{background:transparent;font-size:23px;border-radius:10px;padding:6px}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20}
    .overlay.show{display:block}
    .side-menu{position:fixed;top:0;bottom:0;right:0;width:min(310px,88vw);background:var(--card);z-index:21;transform:translateX(105%);transition:.25s;box-shadow:-10px 0 35px rgba(0,0,0,.18);padding:20px}
    .side-menu.open{transform:translateX(0)}
    .menu-head{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .big-avatar{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#6d3df5,#a47eff);color:#fff;display:grid;place-items:center;font-weight:800}
    .menu-name{font-weight:700}.menu-email{font-size:10px;color:var(--muted);margin-top:3px;direction:ltr;text-align:right}
    .menu-item{width:100%;text-align:right;background:transparent;color:var(--text);padding:14px 5px;border-bottom:1px solid var(--line);font-size:13px}
    .danger{color:#e34d61}
    .auth{position:fixed;inset:0;background:linear-gradient(135deg,#5f35dc,#956eff);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
    .auth.hidden{display:none}
    .auth-card{width:min(430px,100%);background:var(--card);border-radius:26px;padding:24px;box-shadow:0 25px 70px rgba(30,10,80,.25)}
    .auth-logo{text-align:center;font-size:34px}.auth-card h2{text-align:center;margin:8px 0 5px}.auth-card p{text-align:center;color:var(--muted);font-size:12px;margin:0 0 18px}
    .field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin:0 4px 6px}
    .field input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:12px 13px;border-radius:13px;outline:none}
    .primary-btn{width:100%;background:var(--primary);color:#fff;padding:13px;border-radius:14px;margin-top:8px}
    .switch-auth{text-align:center;color:var(--muted);font-size:11px;margin-top:13px}.switch-auth button{background:none;color:var(--primary)}
    .auth-error{display:none;background:#fff0f2;color:#c7344d;padding:9px 11px;border-radius:10px;font-size:11px;margin:10px 0}
    .auth-error.show{display:block}
    .loading{position:fixed;inset:0;background:var(--bg);z-index:60;display:grid;place-items:center}.loading.hide{display:none}
    .loader{text-align:center;color:var(--muted);font-size:12px}.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty{text-align:center;color:var(--muted);font-size:12px;padding:45px 15px}
    @media(min-width:761px){body{padding:18px}.app{height:calc(100dvh - 36px);border-radius:24px;box-shadow:var(--shadow)}}
  </style>
</head>

<body>
  <div id="loading" class="loading"><div class="loader"><div class="spinner"></div>در حال اتصال به آریاچت...</div></div>

  <div id="authScreen" class="auth hidden">
    <div class="auth-card">
      <div class="auth-logo">💜</div>
      <h2>آریاچت</h2>
      <p id="authSubtitle">برای ورود به چت‌روم وارد حساب خود شوید</p>
      <div id="authError" class="auth-error"></div>

      <div id="nameField" class="field" style="display:none">
        <label>نام نمایشی</label>
        <input id="nameInput" maxlength="30" placeholder="مثلاً علی" />
      </div>
      <div class="field">
        <label>ایمیل</label>
        <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>رمز عبور</label>
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر" />
      </div>
      <button id="authSubmit" class="primary-btn">ورود</button>
      <div class="switch-auth"><span id="switchText">حساب ندارید؟</span> <button id="switchMode">ثبت‌نام</button></div>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="toprow">
        <div class="brand">
          <div class="logo">💬</div>
          <div><h1>آریاچت</h1><small>چت‌روم فارسی موبایل</small></div>
        </div>
        <button id="menuBtn" class="icon-btn" aria-label="منو">☰</button>
      </div>
      <div class="onlinebar"><span class="online-dot"></span><span id="onlineCount">۱ کاربر آنلاین</span></div>
    </header>

    <section class="roombar">
      <div><div class="room-title">اتاق عمومی</div><div class="room-sub">گفتگوی آزاد فارسی</div></div>
      <div class="status-pill">● فعال</div>
    </section>

    <main id="messages" class="messages">
      <div class="welcome">به اتاق عمومی آریاچت خوش آمدید 🌷</div>
      <div class="date-sep"><span>امروز</span></div>
      <div id="messageList"></div>
    </main>

    <footer class="composer">
      <div id="typing" class="typing">در حال نوشتن...</div>
      <div id="emojiPanel" class="emoji-panel"></div>
      <div class="inputrow">
        <div class="inputbox">
          <button id="emojiBtn" class="emoji-btn" type="button">😊</button>
          <textarea id="messageInput" rows="1" maxlength="2000" placeholder="پیامتان را بنویسید..."></textarea>
        </div>
        <button id="sendBtn" class="send-btn" type="button">➤</button>
      </div>
    </footer>
  </div>

  <div id="overlay" class="overlay"></div>
  <aside id="sideMenu" class="side-menu">
    <div class="menu-head">
      <div id="menuAvatar" class="big-avatar">?</div>
      <div><div id="menuName" class="menu-name">کاربر</div><div id="menuEmail" class="menu-email"></div></div>
    </div>
    <button id="themeBtn" class="menu-item">🌙 حالت شب</button>
    <button id="logoutBtn" class="menu-item danger">🚪 خروج از حساب</button>
  </aside>

<script>
(() => {
  const SUPABASE_URL = "https://jqbidwpkpqesuvmfhhus.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3jbPpP8Kv8RzFCFSctxIcg_28rrGXsx";

  const { createClient } = window.supabase;
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  const $ = (id) => document.getElementById(id);
  const els = {
    loading:$("loading"), auth:$("authScreen"), authError:$("authError"), authSubtitle:$("authSubtitle"),
    nameField:$("nameField"), nameInput:$("nameInput"), email:$("emailInput"), password:$("passwordInput"),
    authSubmit:$("authSubmit"), switchMode:$("switchMode"), switchText:$("switchText"),
    messages:$("messages"), list:$("messageList"), input:$("messageInput"), send:$("sendBtn"),
    emoji:$("emojiPanel"), emojiBtn:$("emojiBtn"), typing:$("typing"), online:$("onlineCount"),
    menu:$("sideMenu"), overlay:$("overlay"), menuBtn:$("menuBtn"), menuName:$("menuName"),
    menuEmail:$("menuEmail"), menuAvatar:$("menuAvatar"), themeBtn:$("themeBtn"), logout:$("logoutBtn")
  };

  const roomSlug = "general";
  let room = null, user = null, messageChannel = null, presenceChannel = null;
  let signupMode = false;
  const emojis = ["😀","😂","😍","🥰","😎","🤔","😢","😡","❤️","💜","👍","👎","👏","🙏","🔥","✨","🎉","🌷","☕","😂","🤣","😊","😉","😴","🤝","💯","🚀","🌹","🌟","😅","🙌","💖"];

  function faNum(n){ return String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]); }
  function timeText(date){
    return new Intl.DateTimeFormat("fa-IR",{hour:"2-digit",minute:"2-digit"}).format(new Date(date));
  }
  function initial(name){
    return (name || "؟").trim().charAt(0).toUpperCase() || "؟";
  }
  function displayNameFor(u){
    const md = u?.user_metadata || {};
    return md.display_name || md.username || (u?.email ? u.email.split("@")[0] : "کاربر");
  }
  function showError(msg){
    els.authError.textContent = msg;
    els.authError.classList.add("show");
  }
  function clearError(){ els.authError.classList.remove("show"); }
  function setLoading(v){ els.loading.classList.toggle("hide", !v); }

  function setAuthMode(signup){
    signupMode = signup;
    clearError();
    els.nameField.style.display = signup ? "block" : "none";
    els.authSubmit.textContent = signup ? "ساخت حساب" : "ورود";
    els.switchText.textContent = signup ? "قبلاً حساب دارید؟" : "حساب ندارید؟";
    els.switchMode.textContent = signup ? "ورود" : "ثبت‌نام";
    els.authSubtitle.textContent = signup ? "یک حساب بسازید و وارد اتاق شوید" : "برای ورود به چت‌روم وارد حساب خود شوید";
  }

  async function authSubmit(){
    clearError();
    const email = els.email.value.trim();
    const password = els.password.value;
    const name = els.nameInput.value.trim();
    if(!email || !password) return showError("ایمیل و رمز عبور را وارد کنید.");
    if(signupMode && !name) return showError("نام نمایشی را وارد کنید.");
    if(signupMode && password.length < 6) return showError("رمز عبور باید حداقل ۶ کاراکتر باشد.");

    els.authSubmit.disabled = true;
    els.authSubmit.textContent = "لطفاً صبر کنید...";
    try{
      if(signupMode){
        const {data,error} = await supabase.auth.signUp({
          email,password,
          options:{data:{display_name:name,username:name}}
        });
        if(error) throw error;
        if(!data.session) {
          showError("حساب ساخته شد. اگر تأیید ایمیل فعال باشد، ابتدا ایمیل خود را تأیید کنید.");
          setAuthMode(false);
          return;
        }
      }else{
        const {error} = await supabase.auth.signInWithPassword({email,password});
        if(error) throw error;
      }
    }catch(e){ showError(e.message || "عملیات ناموفق بود."); }
    finally{
      els.authSubmit.disabled = false;
      els.authSubmit.textContent = signupMode ? "ساخت حساب" : "ورود";
    }
  }

  async function loadRoom(){
    const {data,error} = await supabase.from("chat_rooms").select("id,name,slug,description").eq("slug",roomSlug).single();
    if(error) throw error;
    room = data;
  }

  async function loadMessages(){
    els.list.innerHTML = '<div class="empty">در حال دریافت پیام‌ها...</div>';
    const {data,error} = await supabase.from("chat_messages")
      .select("id,user_id,content,created_at")
      .eq("room_id",room.id)
      .order("created_at",{ascending:true})
      .limit(100);
    if(error) throw error;

    els.list.innerHTML = "";
    if(!data?.length){
      els.list.innerHTML = '<div class="empty">هنوز پیامی اینجا نیست. اولین پیام را شما بفرستید 🌷</div>';
      return;
    }

    const ids = [...new Set(data.map(m=>m.user_id))];
    const names = {};
    if(user) names[user.id] = displayNameFor(user);

    if(ids.length){
      const {data:profiles} = await supabase.from("profiles")
        .select("id,username,display_name,avatar_url")
        .in("id",ids);
      (profiles || []).forEach(p => names[p.id] = p.display_name || p.username || "کاربر");
    }

    data.forEach(m => renderMessage(m, names[m.user_id] || ("کاربر " + m.user_id.slice(0,6)), false));
    scrollBottom();
  }

  function renderMessage(m, name, scroll=true){
    if(document.querySelector('[data-msg-id="'+m.id+'"]')) return;
    const mine = m.user_id === user?.id;
    const row = document.createElement("div");
    row.className = "msg-row " + (mine ? "mine" : "other");
    row.dataset.msgId = m.id;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = initial(name);

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    if(!mine){
      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = name;
      wrap.appendChild(sender);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = m.content;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = timeText(m.created_at);

    wrap.appendChild(bubble);
    wrap.appendChild(meta);

    if(mine){ row.appendChild(wrap); row.appendChild(avatar); }
    else { row.appendChild(avatar); row.appendChild(wrap); }

    els.list.appendChild(row);
    if(scroll) scrollBottom();
  }

  async function sendMessage(){
    const content = els.input.value.trim();
    if(!content || !user || !room) return;
    els.send.disabled = true;
    const {error} = await supabase.from("chat_messages").insert({
      room_id:room.id,user_id:user.id,content
    });
    if(error){
      alert("ارسال پیام انجام نشد: " + error.message);
    }else{
      els.input.value = "";
      autoGrow();
      publishTyping(false);
    }
    els.send.disabled = false;
    els.input.focus();
  }

  function scrollBottom(){
    requestAnimationFrame(()=>els.messages.scrollTop = els.messages.scrollHeight);
  }

  function autoGrow(){
    els.input.style.height = "auto";
    els.input.style.height = Math.min(110, els.input.scrollHeight) + "px";
  }

  function setupMessagesRealtime(){
    if(messageChannel) supabase.removeChannel(messageChannel);
    messageChannel = supabase.channel("room-messages-" + room.id)
      .on("postgres_changes",
        {event:"INSERT",schema:"public",table:"chat_messages",filter:"room_id=eq."+room.id},
        async payload => {
          let name = payload.new.user_id === user?.id ? displayNameFor(user) : ("کاربر " + payload.new.user_id.slice(0,6));
          if(payload.new.user_id !== user?.id){
            const {data:p} = await supabase.from("profiles").select("username,display_name").eq("id",payload.new.user_id).maybeSingle();
            if(p) name = p.display_name || p.username || name;
          }
          const empty = els.list.querySelector(".empty");
          if(empty) empty.remove();
          renderMessage(payload.new,name,true);
        }
      ).subscribe();
  }

  function setupPresence(){
    if(presenceChannel) supabase.removeChannel(presenceChannel);
    presenceChannel = supabase.channel("room-presence-"+room.id,{
      config:{presence:{key:user.id}}
    });
    presenceChannel.on("presence",{event:"sync"},()=>{
      const state = presenceChannel.presenceState();
      const count = Object.keys(state).length;
      els.online.textContent = faNum(count) + " کاربر آنلاین";
    }).on("presence",{event:"join"},()=>{}).on("presence",{event:"leave"},()=>{});
    presenceChannel.subscribe(async status=>{
      if(status === "SUBSCRIBED"){
        await presenceChannel.track({online_at:new Date().toISOString(),name:displayNameFor(user)});
      }
    });
  }

  let typingTimer;
  function publishTyping(active){
    if(!presenceChannel) return;
    presenceChannel.track({online_at:new Date().toISOString(),name:displayNameFor(user),typing:!!active});
    clearTimeout(typingTimer);
    if(active) typingTimer=setTimeout(()=>publishTyping(false),1200);
  }

  function openMenu(){ els.menu.classList.add("open"); els.overlay.classList.add("show"); }
  function closeMenu(){ els.menu.classList.remove("open"); els.overlay.classList.remove("show"); }

  function setupEmoji(){
    els.emoji.innerHTML = "";
    emojis.forEach(e=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=e;
      b.onclick=()=>{ els.input.value += e; autoGrow(); els.input.focus();
